# The production backend as it runs on Render today (Docker runtime, Standard plan: 1 CPU, 2 GB, which
# the dashboard calls 1c-2g). The service was created in the Render dashboard and is not synced from
# this file, so editing it does not change the service. When the plan or the runtime is changed in the
# dashboard, change it here too.
#
# The backend uses about 470-540 MB of memory, close to the 512 MB of the Free and Starter plans.
services:
  - type: web
    name: heifam
    runtime: docker
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_SSLMODE
        value: require
      - key: SERVER_PORT
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SUPER_ADMIN_EMAILS
        sync: false
      - key: ALLOWED_USER_EMAILS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://heifam.co.kr,https://www.heifam.co.kr
