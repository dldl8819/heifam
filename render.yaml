# The production backend as it runs on Render today: the Docker runtime on plan 1c-2g (1 CPU, 2 GB).
# The service was created in the Render dashboard and is not synced from this file, so editing it does
# not change the service. When the plan, the runtime or the deploy trigger is changed in the dashboard,
# change it here too.
#
# The backend uses about 470-540 MB of memory, close to the 512 MB of the smaller plans.
services:
  - type: web
    name: heifam
    runtime: docker
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 1c-2g
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_SSLMODE
        value: require
      - key: SERVER_PORT
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SUPER_ADMIN_EMAILS
        sync: false
      - key: ALLOWED_USER_EMAILS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://heifam.co.kr,https://www.heifam.co.kr
