# Checks every pull request and every commit on main. main requires the backend and frontend jobs
# to pass before a merge, and Render deploys the backend only after they pass on the commit.
# The tests need no secrets: the backend's mock every repository, the frontend's run in Node, and the
# accessibility checks answer the backend's calls inside the browser.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # The Gradle toolchain asks for Java 25, as the production image runs.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # The same Node as Vercel builds with (engines.node in package.json).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

  # The built site in a browser, checked by axe-core against WCAG 2.2 A and AA: the visitor pages and
  # every menu page of a signed-in super admin, in light and dark mode, each with and without high
  # contrast (frontend/e2e). The backend and Supabase are answered inside the browser, so no secret is
  # needed: the Supabase address and key below are placeholders the build needs to start. It runs on
  # the runner's Google Chrome, so no browser is downloaded.
  accessibility:
    name: accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: YOUR_API_KEY
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Accessibility checks
        run: npm run test:a11y
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: frontend/playwright-report
          retention-days: 7
