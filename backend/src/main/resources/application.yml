server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework

spring:
  web:
    # Spring Boot 4 moved these from server.error; the old keys are ignored.
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
  jackson:
    # Keeps the JSON rules the API had under Jackson 2: a missing or null boolean reads as false,
    # text after the JSON value is ignored, and error timestamps end in +00:00. Jackson 3's own
    # defaults are stricter; moving to them changes what the API accepts, so do it on purpose.
    use-jackson2-defaults: true
  config:
    import: optional:file:../.env[.properties],optional:file:../.env.local[.properties],optional:file:.env[.properties],optional:file:.env.local[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: heifam-hikari
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:2}
      data-source-properties:
        sslmode: ${SPRING_DATASOURCE_SSLMODE:prefer}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.security: ${SPRING_SECURITY_LOG_LEVEL:INFO}
    org.springframework.web.filter.CommonsRequestLoggingFilter: OFF

management:
  endpoint:
    env:
      show-values: never
    configprops:
      show-values: never

balancify:
  integrations:
    upbit:
      enabled: ${UPBIT_ENABLED:false}
      base-url: ${UPBIT_BASE_URL:https://api.upbit.com}
      access-key: ${UPBIT_ACCESS_KEY:}
      secret-key: ${UPBIT_SECRET_KEY:}
  access:
    # In-process TTL for a resolved access state. Grants/revocations evict immediately on the
    # instance that applied them; this only bounds cross-instance staleness. 0 disables caching.
    state-cache-ttl-ms: ${ACCESS_STATE_CACHE_TTL_MS:30000}
  security:
    jwt:
      enabled: ${JWT_ENABLED:false}
      issuer: ${JWT_ISSUER:heifam}
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  elo:
    k-factor: ${ELO_K_FACTOR:36}
    win-rate-denominator: ${ELO_WIN_RATE_DENOMINATOR:800}
    large-gap-threshold: ${ELO_LARGE_GAP_THRESHOLD:300}
    large-gap-range: ${ELO_LARGE_GAP_RANGE:900}
    large-gap-min-multiplier: ${ELO_LARGE_GAP_MIN_MULTIPLIER:0.6}
    low-tier-multiplier: ${ELO_LOW_TIER_MULTIPLIER:0.7}
    underdog-upset-bonus-threshold: ${ELO_UNDERDOG_UPSET_BONUS_THRESHOLD:200}
    underdog-upset-bonus-range: ${ELO_UNDERDOG_UPSET_BONUS_RANGE:800}
    underdog-upset-max-multiplier: ${ELO_UNDERDOG_UPSET_MAX_MULTIPLIER:1.5}
  multi-balance:
    recent-lookback-count: ${MULTI_BALANCE_RECENT_LOOKBACK_COUNT:10}
    internal-mmr-diff-weight: ${MULTI_BALANCE_INTERNAL_MMR_DIFF_WEIGHT:1000.0}
    inter-match-balance-weight: ${MULTI_BALANCE_INTER_MATCH_BALANCE_WEIGHT:150.0}
    repeat-teammate-penalty-weight: ${MULTI_BALANCE_REPEAT_TEAMMATE_WEIGHT:2.0}
    repeat-matchup-penalty-weight: ${MULTI_BALANCE_REPEAT_MATCHUP_WEIGHT:1.5}
    race-penalty-weight: ${MULTI_BALANCE_RACE_WEIGHT:1.0}
  admin:
    emails: ${ADMIN_EMAILS:}
    super-emails: ${SUPER_ADMIN_EMAILS:}
    allowed-emails: ${ALLOWED_USER_EMAILS:}
  auth:
    require-jwt: ${AUTH_REQUIRE_JWT:true}
    allow-email-header-fallback: ${AUTH_ALLOW_EMAIL_HEADER_FALLBACK:false}
    api-key: ${SUPABASE_PUBLISHABLE_KEY:${SUPABASE_ANON_KEY:}}
    supabase-url: ${SUPABASE_URL:}
    verify-timeout-ms: ${SUPABASE_VERIFY_TIMEOUT_MS:3000}
    verification-cache-ttl-seconds: ${SUPABASE_VERIFICATION_CACHE_TTL_SECONDS:60}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  rank:
    dormancy:
      enabled: ${RANK_DORMANCY_ENABLED:true}
      inactive-days: ${RANK_DORMANCY_INACTIVE_DAYS:15}
  match:
    confirm:
      duplicate-window-minutes: ${MATCH_CONFIRM_DUPLICATE_WINDOW_MINUTES:5}
  points:
    # Points are open to members (since 2026-10); false keeps earning to admins, which also needs
    # the point routes in AdminKeyFilter and the /points page moved back to admins.
    members-enabled: ${POINTS_MEMBERS_ENABLED:true}
    daily-login: ${POINTS_DAILY_LOGIN:1}
    match-result: ${POINTS_MATCH_RESULT:1}
    match-result-daily-cap: ${POINTS_MATCH_RESULT_DAILY_CAP:10}
    prediction-hit: ${POINTS_PREDICTION_HIT:1}
    prediction-hit-daily-cap: ${POINTS_PREDICTION_HIT_DAILY_CAP:10}
    # Reading, liking and commenting on a notice each earn this once per notice (up to 3 a notice).
    notice-action: ${POINTS_NOTICE_ACTION:1}
    # Liking someone else's comment on a notice: once per comment, up to the cap a day.
    notice-comment-like: ${POINTS_NOTICE_COMMENT_LIKE:1}
    notice-comment-like-daily-cap: ${POINTS_NOTICE_COMMENT_LIKE_DAILY_CAP:10}
    # A player confirming the result of a balanced 3v3 match they played, within the window after
    # the result came in.
    match-confirm: ${POINTS_MATCH_CONFIRM:1}
    match-confirm-daily-cap: ${POINTS_MATCH_CONFIRM_DAILY_CAP:10}
    match-confirm-window-hours: ${POINTS_MATCH_CONFIRM_WINDOW_HOURS:48}
  tournament:
    # Admins try team tournaments out first. true lets members record tournament games; running
    # tournaments also needs the tournament routes in AdminKeyFilter and the screen opened to members.
    members-enabled: ${TOURNAMENT_MEMBERS_ENABLED:false}
  predictions:
    # Predictions are open to members (since 2026-10); false keeps picks to admins, which also needs
    # the prediction routes in AdminKeyFilter and the /predictions page moved back to admins.
    members-enabled: ${PREDICTIONS_MEMBERS_ENABLED:true}
    # Minutes after a match is set up during which picks are taken.
    window-minutes: ${PREDICTIONS_WINDOW_MINUTES:3}
  notifications:
    # Notifications reach every member with service access (since 2026-10); false keeps them to
    # admins, which also needs the notification routes in AdminKeyFilter and the bell hidden again.
    members-enabled: ${NOTIFICATIONS_MEMBERS_ENABLED:true}
  push:
    # Web Push to browsers and installed apps; off until all three are set. Keys are base64url
    # (npx web-push generate-vapid-keys), the subject a mailto: or https: contact for push services.
    vapid-public-key: ${WEB_PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${WEB_PUSH_VAPID_PRIVATE_KEY:}
    subject: ${WEB_PUSH_SUBJECT:}
