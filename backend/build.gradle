plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.heifam'
version = '0.0.1-SNAPSHOT'

// Windows에서 프로젝트 경로에 한글이 섞이면 포크된 테스트 워커 JVM이 클래스패스를 해석하지
// 못해 모든 테스트가 ClassNotFoundException으로 죽는다. 빌드 산출물만 ASCII 경로로 빼면
// 테스트 클래스패스에서 한글이 사라져 우회된다. 값이 주어진 환경에서만 적용하므로
// 저장소 자체는 어디서든 그대로 빌드된다.
def overriddenBuildDir = providers.gradleProperty('heifam.buildDir').orNull
if (overriddenBuildDir) {
    layout.buildDirectory.set(file(overriddenBuildDir))
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Patch releases newer than the ones Spring Boot 4.1.1 manages, taken for their security fixes
// (Tomcat 11.0.25: CVE-2026-65905, CVE-2026-65182, CVE-2026-68525; Jackson 3.1.6 and 3.1.7:
// CVE-2026-89407 and others). Drop a line once Spring Boot manages that version or a later one.
ext['tomcat.version'] = '11.0.26'
ext['jackson-bom.version'] = '3.1.7'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.0.2'
    // Since Spring Boot 4 the starter is what turns Flyway on; flyway-core alone runs no migration.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // Flyway 10+ keeps PostgreSQL support in its own module; without it startup fails.
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Sources are UTF-8 (Korean text). The wrapper scripts used to pass -Dfile.encoding for this; a
// regenerated wrapper drops such edits, so the compiler is told here.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    archiveFileName = 'heifam-backend.jar'
}
